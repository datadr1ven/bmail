<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Mosaic Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Add Tailwind -->
    <link rel="stylesheet" href="styles.css" />
    <!-- Keep custom for overrides if needed -->
  </head>
  <body>
    <div class="container mx-auto p-4 max-w-lg">
      <!-- Tailwind classes for responsive container -->
      <h1 class="text-2xl font-bold text-center mb-4">
        Media Mosaic Generator
      </h1>
      <div class="mb-4">
        <label for="file-input" class="block text-sm font-medium mb-2"
          >Upload Media Files (Images, Videos, Audio):</label
        >
        <input
          type="file"
          id="file-input"
          multiple
          accept="image/*,video/*,audio/*"
          class="w-full p-2 border rounded"
        />
      </div>
      <button
        id="generate-btn"
        class="w-full bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 mb-4"
      >
        Generate Mosaic
      </button>
      <div id="mosaic-preview" class="border p-4 bg-gray-50 min-h-64"></div>
      <button
        id="send-btn"
        class="w-full bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 mt-4"
      >
        Send via Email
      </button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
