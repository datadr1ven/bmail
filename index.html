<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Mosaic Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div
      class="container mx-auto p-4 max-w-2xl bg-white shadow-xl rounded-xl mt-6"
    >
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
        Media Mosaic Generator
      </h1>
      <div class="mb-4">
        <label
          for="file-input"
          class="block text-lg font-semibold mb-2 text-gray-700"
          >Upload Media Files (Images, Videos, Audio):</label
        >
        <input
          type="file"
          id="file-input"
          multiple
          accept="image/*,video/*,audio/*"
          class="w-full p-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>
      <div
        id="mosaic-preview"
        class="border-2 border-gray-200 p-4 bg-gray-50 rounded-lg min-h-64 mb-4"
      ></div>
      <button
        id="send-btn"
        class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white py-3 px-6 rounded-lg hover:from-green-600 hover:to-green-700 transition-all duration-300 font-semibold text-lg"
      >
        Send via Email
      </button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
